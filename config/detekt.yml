# Detekt 静态分析配置
# 文档：https://detekt.dev/docs/configuration/
#
# 修复存量后启用 ignoreFailures=false 阻断 CI。
# noise 类别（MagicNumber / WildcardImport / MaxLineLength / TooGenericExceptionCaught）
# 已在规则级别 disable；不在 build.excludes（excludes 对部分规则不生效）。

build:
  excludes:
    - '**/test/**'
    - '**/androidTest/**'
    - '**/build/**'
    - '**/generated/**'
    - '**/*.kts'

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

# ============ 复杂度 ============
# Compose Composable 函数天然较长，放宽阈值
complexity:
  LongMethod:
    threshold: 300  # 复杂 Compose Screen（带 TopAppBar + Section + Dialog）
  LongParameterList:
    # Compose 组件（带 default param）和 Retrofit API 常有 8-11 个参数
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDataClasses: true
    ignoreAnnotated: ['Inject']
  ComplexCondition:
    threshold: 6  # 支付关键词匹配（5 条件）是合理
  NestedBlockDepth:
    threshold: 6
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 40  # DTO mapping / 状态机天然高
  LabeledExpression:
    active: false

# ============ 代码风格 ============
style:
  # Regex 字面量、超时常量、Canvas 绘制参数不该视为 magic number
  MagicNumber:
    active: false
  # Compose 标准做法是 wildcard import
  WildcardImport:
    active: false
  # 行长由 ktlint / IDE formatter 处理
  MaxLineLength:
    active: false
  ReturnCount:
    max: 15  # AccessibilityService 事件分发有多重防御 early return
  UnusedPrivateMember:
    active: false
  RedundantVisibilityModifierRule:
    active: false
  UnusedImports:
    active: true
  NewLineAtEndOfFile:
    active: true
  # regex parser 经常 break+continue+return
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3

# ============ 命名 ============
naming:
  active: true
  # Compose Composable 命名规范是 PascalCase，与 detekt 默认不兼容
  FunctionNaming:
    active: false
  # Kotlin 惯例：在 Composable 文件中内嵌 data class 是合理做法
  MatchingDeclarationName:
    active: false
  TopLevelPropertyNaming:
    active: false  # const 用 PascalCase 是项目约定（PrivacyMask 等）
  ConstructorParameterNaming:
    active: false
  VariableNaming:
    active: false  # UPPER_SNAKE_CASE 的 private val（列表常量）是项目约定
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-zA-Z0-9]*)*'

# ============ 潜在 Bug ============
potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  CastToNullableType:
    active: true

# ============ 性能 ============
performance:
  SpreadOperator:
    active: false

# ============ 协程 ============
coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunWithFlowReturnType:
    active: true
  SleepInsteadOfDelay:
    active: true

# ============ 空块 ============
empty-blocks:
  active: true
  EmptyCatchBlock:
    allowedExceptionNameRegex: '_|(ignore|expected).*'

# ============ 异常 ============
exceptions:
  SwallowedException:
    active: false  # 业务代码 catch 后记 Timber 日志是合理做法
  # 业务代码 catch 通用异常做防御是合理做法
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false  # 测试 mock 经常 throw RuntimeException
